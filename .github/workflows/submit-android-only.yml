# Submit an existing Android .aab to Google Play — no rebuild.
# Use when a build succeeded but submit failed (or to retry submit).
#
# How:
# 1. Open the successful "Build Android" run → note the Run ID (URL: .../actions/runs/<RUN_ID>)
# 2. Actions → "Submit Android only" → Run workflow → paste that Run ID
#
# Requires: ANDROID_SERVICE_ACCOUNT_JSON, EXPO_TOKEN (same as full pipeline)

name: Submit Android only

on:
  workflow_dispatch:
    inputs:
      source_run_id:
        description: 'GitHub Actions run ID that uploaded the android-build artifact (from Build Android workflow)'
        required: true
        type: string
      play_track:
        description: 'Google Play track'
        required: false
        default: 'alpha'
        type: choice
        options:
          - internal
          - alpha
          - beta
          - production

permissions:
  contents: read
  actions: read

jobs:
  submit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (config only)
        uses: actions/checkout@v4
        with:
          submodules: false
          sparse-checkout: |
            /*
            !manager-francis
          sparse-checkout-cone-mode: false

      - name: Remove manager-francis submodule entry (same as build-android)
        run: |
          git config --remove-section submodule.manager-francis 2>/dev/null || true
          rm -rf manager-francis 2>/dev/null || true
        continue-on-error: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Download android-build from source run
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          RUN_ID="${{ github.event.inputs.source_run_id }}"
          if ! [[ "$RUN_ID" =~ ^[0-9]+$ ]]; then
            echo "::error::source_run_id must be numeric (e.g. 12345678901)"
            exit 1
          fi
          echo "Downloading artifact android-build from run $RUN_ID ..."
          gh run download "$RUN_ID" -n android-build -R "${{ github.repository }}" || {
            echo "::error::Download failed. Use a run ID from a completed Build Android job that uploaded android-build."
            exit 1
          }
          echo "Downloaded:"
          find . -maxdepth 4 -name "*.aab" -type f 2>/dev/null || true

      - name: Submit to Google Play
        run: |
          if [ -z "$ANDROID_SERVICE_ACCOUNT_JSON" ]; then
            echo "::error::ANDROID_SERVICE_ACCOUNT_JSON not set."
            exit 1
          fi
          AAB=$(find . -maxdepth 8 -name "*.aab" -type f 2>/dev/null | head -1)
          if [ -z "$AAB" ]; then
            echo "::error::No .aab in downloaded artifact"
            exit 1
          fi
          echo "Submitting: $AAB"
          if [ -f android-build-version.txt ]; then cat android-build-version.txt; fi
          cp app.config.js app.config.js.bak
          cp app.config.submit.js app.config.js
          trap 'mv -f app.config.js.bak app.config.js' EXIT
          SERVICE_ACCOUNT_PATH="/tmp/play-service-account.json"
          node -e "
            const fs = require('fs');
            let json = process.env.ANDROID_SERVICE_ACCOUNT_JSON || '';
            json = json.replace(/^\uFEFF/, '').trim();
            fs.writeFileSync('$SERVICE_ACCOUNT_PATH', json, 'utf8');
          "
          PLAY_TRACK="${{ github.event.inputs.play_track || 'alpha' }}"
          echo "Track: $PLAY_TRACK"
          node -e "
            const fs = require('fs');
            let raw = fs.readFileSync('eas.json', 'utf8');
            if (raw.charCodeAt(0) === 0xFEFF) raw = raw.slice(1);
            const easJson = JSON.parse(raw);
            easJson.submit.production.android.serviceAccountKeyPath = '$SERVICE_ACCOUNT_PATH';
            easJson.submit.production.android.track = '$PLAY_TRACK';
            fs.writeFileSync('eas.json', JSON.stringify(easJson, null, 2) + '\n');
          "
          npx eas-cli submit --platform android --path "$AAB" --profile production --non-interactive
          echo "✅ Submitted to Google Play"
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          ANDROID_SERVICE_ACCOUNT_JSON: ${{ secrets.ANDROID_SERVICE_ACCOUNT_JSON }}
