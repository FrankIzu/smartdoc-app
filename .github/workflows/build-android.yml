# Build Android app with EAS local (no EAS cloud charge).
# Trigger: manual (workflow_dispatch) only. Deploy script triggers the selected platform (iOS or Android) via gh workflow run after push.
# Requires: GitHub secret EXPO_TOKEN (Expo access token).
# Auto-submit: Automatically submits to Google Play Store after successful production builds.
#   Requires: ANDROID_SERVICE_ACCOUNT_JSON in GitHub Secrets.
#
# Combo for 5–8 min release builds (<5 min on warm cache): Gradle cache + configuration cache + Linux + no clean + cache npm.
# Cache rotation: Bump CACHE_VERSION below to stay under ~10GB repo cache limit.

name: Build Android (EAS local)

on:
  workflow_dispatch:
    inputs:
      profile:
        description: 'EAS profile'
        required: true
        default: 'production'
        type: choice
        options:
          - production
          - preview
          - development
      play_track:
        description: 'Google Play release track (only for profile=production). App not in prod yet — use internal or alpha (closed testing).'
        required: false
        default: 'alpha'
        type: choice
        options:
          - internal
          - alpha
          - beta
          - production
      android_version_code:
        description: 'Android versionCode (must be > Play max). deploy.ps1 -BuildNumber'
        required: true
        type: string

jobs:
  build:
    # Optional: use a larger runner for faster R8/compile (e.g. ubuntu-latest-4-cores)
    runs-on: ubuntu-latest
    # Default permissions (no git push from this workflow; version from app.versions.json)
    env:
      CACHE_VERSION: "1"
    steps:
      - name: Set cache paths
        run: |
          echo "ANDROID_SDK_CACHE_PATH=${{ runner.temp }}/android-sdk" >> $GITHUB_ENV
          echo "GRADLE_USER_HOME=${{ runner.temp }}/gradle" >> $GITHUB_ENV
      - name: Checkout (exclude manager-francis; app build does not use it)
        uses: actions/checkout@v4
        with:
          submodules: false
          sparse-checkout: |
            /*
            !manager-francis
          sparse-checkout-cone-mode: false

      - name: Remove manager-francis submodule entry so git commands do not touch it
        run: |
          set +e
          # Remove submodule references so post-job cleanup (git submodule foreach) does not fail with "No url found for submodule path 'manager-francis'"
          if [ -f .gitmodules ]; then
            git config -f .gitmodules --remove-section submodule.manager-francis 2>/dev/null || true
            # If .gitmodules is empty or only has whitespace, remove it so git does not see any submodules
            if [ -f .gitmodules ] && [ ! -s .gitmodules ]; then
              rm -f .gitmodules
            fi
            # Remove [submodule "manager-francis"] block by sed if section removal left a broken file
            if [ -f .gitmodules ] && grep -q 'manager-francis' .gitmodules 2>/dev/null; then
              sed -i '/\[submodule "manager-francis"\]/,/^$/d' .gitmodules 2>/dev/null || true
              [ ! -s .gitmodules ] && rm -f .gitmodules || true
            fi
          fi
          git config --remove-section submodule.manager-francis 2>/dev/null || true
          git submodule deinit -f manager-francis 2>/dev/null || true
          git rm --cached manager-francis 2>/dev/null || true
          rm -rf .git/modules/manager-francis manager-francis 2>/dev/null || true
          git reset --hard HEAD 2>/dev/null || true
          git status > /dev/null 2>&1 || echo "Warning: git status check failed, but continuing..."
        continue-on-error: true

      # Only touches android.versionCode — never overwrites version or ios.buildNumber.
      - name: Apply Android versionCode (workflow input)
        run: |
          CODE="${{ github.event.inputs.android_version_code }}"
          if ! [[ "$CODE" =~ ^[0-9]+$ ]]; then
            echo "::error::android_version_code must be a positive integer, got: $CODE"
            exit 1
          fi
          node -e "
            const fs = require('fs');
            const p = 'app.versions.json';
            const j = JSON.parse(fs.readFileSync(p, 'utf8'));
            if (!j.android) j.android = {};
            j.android.versionCode = parseInt(process.env.VERSION_CODE, 10);
            fs.writeFileSync(p, JSON.stringify(j, null, 2) + '\n');
            console.log('app.versions.json android.versionCode =', j.android.versionCode, '(version, ios unchanged)');
          "
          cat app.versions.json
        env:
          VERSION_CODE: ${{ github.event.inputs.android_version_code }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Setup EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Restore Android SDK cache
        uses: actions/cache/restore@v4
        id: android-sdk-cache
        continue-on-error: true
        with:
          path: ${{ env.ANDROID_SDK_CACHE_PATH }}
          key: android-sdk-${{ runner.os }}-${{ env.CACHE_VERSION }}-11076708-36-25.1.8937393
          restore-keys: |
            android-sdk-${{ runner.os }}-${{ env.CACHE_VERSION }}-

      - name: Setup Android SDK
        id: setup-android
        run: |
          set -e
          ANDROID_HOME="$ANDROID_SDK_CACHE_PATH"
          RUNNER_SDK="/usr/local/lib/android/sdk"
          SDKMANAGER=""
          DOWNLOADED="false"
          if [ -x "$ANDROID_SDK_CACHE_PATH/cmdline-tools/latest/bin/sdkmanager" ]; then
            echo "Using cached Android SDK at $ANDROID_HOME"
            SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          elif [ -x "$RUNNER_SDK/cmdline-tools/latest/bin/sdkmanager" ] || [ -x "$RUNNER_SDK/cmdline-tools/12.0/bin/sdkmanager" ]; then
            for d in "$RUNNER_SDK/cmdline-tools/latest/bin" "$RUNNER_SDK/cmdline-tools/12.0/bin"; do
              [ -x "$d/sdkmanager" ] && SDKMANAGER="$d/sdkmanager" && break
            done
            if [ -n "$SDKMANAGER" ]; then
              ANDROID_HOME="$RUNNER_SDK"
              echo "Using runner preinstalled Android SDK at $ANDROID_HOME"
              export PATH="$RUNNER_SDK/cmdline-tools/latest/bin:$RUNNER_SDK/cmdline-tools/12.0/bin:$RUNNER_SDK/platform-tools:$PATH"
              yes | "$SDKMANAGER" --licenses || true
              "$SDKMANAGER" "platform-tools" "platforms;android-36" "build-tools;36.0.0" "ndk;25.1.8937393"
            fi
          fi
          if [ -z "$SDKMANAGER" ]; then
            echo "Downloading Android commandline-tools (cache miss and no runner SDK)"
            DOWNLOADED="true"
            mkdir -p "$ANDROID_HOME/cmdline-tools"
            CDL="commandlinetools-linux-11076708_latest.zip"
            wget -q "https://dl.google.com/android/repository/$CDL" -O /tmp/cmdline-tools.zip
            unzip -q -o /tmp/cmdline-tools.zip -d "$ANDROID_HOME/cmdline-tools"
            mv "$ANDROID_HOME/cmdline-tools/cmdline-tools" "$ANDROID_HOME/cmdline-tools/latest"
            SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
            yes | "$SDKMANAGER" --licenses || true
            "$SDKMANAGER" "platform-tools" "platforms;android-36" "build-tools;36.0.0" "ndk;25.1.8937393"
          fi
          echo "ANDROID_HOME=$ANDROID_HOME" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> $GITHUB_ENV
          echo "downloaded=$DOWNLOADED" >> $GITHUB_OUTPUT
          echo "$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools" >> $GITHUB_PATH
          if [ "$ANDROID_HOME" = "$RUNNER_SDK" ]; then
            echo "$RUNNER_SDK/cmdline-tools/latest/bin:$RUNNER_SDK/cmdline-tools/12.0/bin:$RUNNER_SDK/platform-tools" >> $GITHUB_PATH
          fi

      - name: Save Android SDK cache
        if: steps.android-sdk-cache.outputs.cache-restored != 'true' && steps.setup-android.outputs.downloaded == 'true'
        uses: actions/cache/save@v4
        continue-on-error: true
        with:
          path: ${{ env.ANDROID_SDK_CACHE_PATH }}
          key: android-sdk-${{ runner.os }}-${{ env.CACHE_VERSION }}-11076708-36-25.1.8937393

      - name: Restore Gradle cache
        uses: actions/cache/restore@v4
        id: gradle-cache
        continue-on-error: true
        with:
          path: ${{ env.GRADLE_USER_HOME }}
          key: gradle-${{ runner.os }}-${{ env.CACHE_VERSION }}-${{ hashFiles('android/**/*.gradle*', 'package-lock.json') }}
          restore-keys: |
            gradle-${{ runner.os }}-${{ env.CACHE_VERSION }}-

      - name: Install dependencies
        run: npm ci

      # Generate android/ so gradle.properties exists for patching. EAS build --local uses this folder and skips prebuild.
      - name: Expo prebuild (Android)
        run: npx expo prebuild --platform android --clean --non-interactive
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}

      - name: Disable configuration cache (Expo/RN build.gradle runs Node during config)
        run: |
          sed -i 's/^org\.gradle\.configuration-cache=.*/org.gradle.configuration-cache=false/' android/gradle.properties

      # Gradle memory + disable release lint (avoids lintVitalAnalyzeRelease Metaspace OOM in CI).
      - name: "Gradle properties: memory and parallel"
        run: |
          echo '' >> android/gradle.properties
          echo '# CI: heap + Metaspace + Kotlin daemon (avoid OOM during build/lint)' >> android/gradle.properties
          echo 'org.gradle.jvmargs=-Xmx6g -XX:MaxMetaspaceSize=2g -Dkotlin.daemon.jvm.options=-Xmx3g' >> android/gradle.properties
          echo 'org.gradle.daemon=true' >> android/gradle.properties
          echo 'org.gradle.parallel=true' >> android/gradle.properties
          echo 'org.gradle.configureondemand=true' >> android/gradle.properties

      # Lint for release is disabled by Expo config plugin (plugins/android-disable-release-lint.js) during prebuild.

      # Force versionCode from app.versions.json into build.gradle so the AAB always matches the repo (avoids EAS/prebuild using a stale value).
      - name: Sync versionCode from app.versions.json to build.gradle
        run: |
          VERSION_CODE=$(node -e "const v=require('./app.versions.json'); console.log(v?.android?.versionCode ?? 0)")
          echo "app.versions.json versionCode: $VERSION_CODE"
          if [ -z "$VERSION_CODE" ] || [ "$VERSION_CODE" = "0" ]; then
            echo "::error::android versionCode missing in app.versions.json"
            exit 1
          fi
          if [ -f android/app/build.gradle ]; then
            # Match versionCode followed by integer (defaultConfig or any line)
            sed -i -E 's/(versionCode[[:space:]]+)[0-9]+/\1'"$VERSION_CODE"'/g' android/app/build.gradle
            echo "Patched android/app/build.gradle; versionCode lines:"
            grep -n versionCode android/app/build.gradle || true
          else
            echo "::warning::android/app/build.gradle not found, skipping sync"
          fi

      - name: Prepare preview build (single ABI, no minify)
        if: github.event.inputs.profile == 'preview' || github.event.inputs.profile == 'development'
        run: |
          echo "Preview/development: single ABI (arm64-v8a), minify disabled"
          sed -i 's/^reactNativeArchitectures=.*/reactNativeArchitectures=arm64-v8a/' android/gradle.properties
          sed -i 's/^android\.enableMinifyInReleaseBuilds=.*/android.enableMinifyInReleaseBuilds=false/' android/gradle.properties
          sed -i 's/^android\.enableShrinkResourcesInReleaseBuilds=.*/android.enableShrinkResourcesInReleaseBuilds=false/' android/gradle.properties

      # Production: ensure minify + resource shrinking so R8 reduces size and generates mapping.txt for Play deobfuscation.
      - name: Ensure production minify and shrink (smaller AAB, mapping file)
        if: github.event.inputs.profile == 'production'
        run: |
          F=android/gradle.properties
          grep -q 'android.enableMinifyInReleaseBuilds' "$F" && sed -i 's/^android\.enableMinifyInReleaseBuilds=.*/android.enableMinifyInReleaseBuilds=true/' "$F" || echo 'android.enableMinifyInReleaseBuilds=true' >> "$F"
          grep -q 'android.enableShrinkResourcesInReleaseBuilds' "$F" && sed -i 's/^android\.enableShrinkResourcesInReleaseBuilds=.*/android.enableShrinkResourcesInReleaseBuilds=true/' "$F" || echo 'android.enableShrinkResourcesInReleaseBuilds=true' >> "$F"
          echo "Production: minify and shrink resources enabled"

      # No clean: we don't run gradle clean; incremental build uses Gradle cache (5–8 min, <5 warm).
      - name: Clean old build artifacts
        run: |
          echo "Cleaning old AAB/APK files..."
          find . -maxdepth 3 -name "*.aab" -type f -delete 2>/dev/null || true
          find . -maxdepth 3 -name "*.apk" -type f -delete 2>/dev/null || true
          echo "Old artifacts cleaned"

      # Use version and versionCode from app.versions.json (set by deploy.ps1 before triggering this workflow).
      - name: EAS Build (local)
        run: |
          if [ -z "$EXPO_TOKEN" ]; then
            echo "::error::EXPO_TOKEN secret is missing or empty. Add it in repo Settings → Secrets and variables → Actions (name exactly: EXPO_TOKEN)"
            exit 1
          fi
          PROFILE="${{ github.event.inputs.profile || 'production' }}"
          echo "Final android/app/build.gradle versionCode before eas build:"
          grep -n versionCode android/app/build.gradle || true
          eas build --platform android --profile "$PROFILE" --local --non-interactive
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          GRADLE_USER_HOME: ${{ env.GRADLE_USER_HOME }}
          GRADLE_OPTS: -Xmx6g -XX:MaxMetaspaceSize=2g -Dkotlin.daemon.jvm.options=-Xmx3g

      - name: Save Gradle cache
        uses: actions/cache/save@v4
        if: success() && steps.gradle-cache.outputs.cache-restored != 'true'
        continue-on-error: true
        with:
          path: ${{ env.GRADLE_USER_HOME }}
          key: gradle-${{ runner.os }}-${{ env.CACHE_VERSION }}-${{ hashFiles('android/**/*.gradle*', 'package-lock.json') }}

      - name: Record versionCode for logs
        if: success()
        run: |
          VC=$(node -e "try{console.log(require('./app.versions.json').android.versionCode||'')}catch(e){console.log('')}")
          echo "BUILD_ANDROID_VERSION_CODE=$VC" | tee android-build-version.txt
          echo "If submit fails with duplicate version, Play max must be < this value."

      - name: Upload Android artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-build
          path: |
            build-*.aab
            *.apk
            android/app/build/outputs/mapping/release/mapping.txt
            android-build-version.txt
          if-no-files-found: ignore

  submit:
    needs: build
    runs-on: ubuntu-latest
    if: github.event.inputs.profile == 'production'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: false
          sparse-checkout: |
            /*
            !manager-francis
          sparse-checkout-cone-mode: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Download Android artifact
        uses: actions/download-artifact@v4
        with:
          name: android-build

      - name: Show built versionCode (must exceed Play Console max)
        run: |
          if [ -f android-build-version.txt ]; then cat android-build-version.txt; fi
          find . -maxdepth 6 -name "*.aab" -type f 2>/dev/null | head -3 || true

      - name: Submit to Google Play
        run: |
          if [ -z "$ANDROID_SERVICE_ACCOUNT_JSON" ]; then
            echo "::error::ANDROID_SERVICE_ACCOUNT_JSON not set. Add it to GitHub Secrets to enable auto-submit."
            exit 1
          fi
          AAB=$(find . -maxdepth 5 -name "*.aab" -type f 2>/dev/null | head -1)
          if [ -z "$AAB" ]; then
            echo "::error::No .aab file found in artifact"
            exit 1
          fi
          # Deobfuscation: mapping.txt is in the android-build artifact. Upload in Play Console to clear the warning:
          # Testing > Closed testing (or your track) > Release (VERSION CODE 60) > App bundle explorer > select this version > Deobfuscation file > Upload mapping file.
          if [ -f "android/app/build/outputs/mapping/release/mapping.txt" ]; then
            echo "R8 mapping file present. Upload it in Play Console: Release > App bundle explorer > this version > Deobfuscation file"
          fi
          # Swap to plugin-free config so EAS submit doesn't resolve plugins (expo-router, etc.)
          cp app.config.js app.config.js.bak
          cp app.config.submit.js app.config.js
          trap 'mv -f app.config.js.bak app.config.js' EXIT
          echo "Submitting Android app to Google Play Store..."
          SERVICE_ACCOUNT_PATH="/tmp/play-service-account.json"
          node -e "
            const fs = require('fs');
            let json = process.env.ANDROID_SERVICE_ACCOUNT_JSON || '';
            json = json.replace(/^\uFEFF/, '').trim();
            fs.writeFileSync('$SERVICE_ACCOUNT_PATH', json, 'utf8');
          "
          PLAY_TRACK="${{ github.event.inputs.play_track || 'alpha' }}"
          echo "Submitting to Google Play track: $PLAY_TRACK"
          node -e "
            const fs = require('fs');
            let raw = fs.readFileSync('eas.json', 'utf8');
            if (raw.charCodeAt(0) === 0xFEFF) raw = raw.slice(1);
            const easJson = JSON.parse(raw);
            easJson.submit.production.android.serviceAccountKeyPath = '$SERVICE_ACCOUNT_PATH';
            easJson.submit.production.android.track = '$PLAY_TRACK';
            fs.writeFileSync('eas.json', JSON.stringify(easJson, null, 2) + '\n');
          "
          npx eas-cli submit --platform android --path "$AAB" --profile production --non-interactive
          echo "✅ Successfully submitted to Google Play Store!"
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          ANDROID_SERVICE_ACCOUNT_JSON: ${{ secrets.ANDROID_SERVICE_ACCOUNT_JSON }}

      - name: Send success email
        if: success()
        continue-on-error: true
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: ${{ secrets.SMTP_SERVER }}
          server_port: ${{ secrets.SMTP_PORT }}
          username: ${{ secrets.SMTP_USERNAME }}
          password: ${{ secrets.SMTP_PASSWORD }}
          subject: '✅ Android Build & Deploy Successful - GrabDocs'
          to: dev@grabdocs.com
          from: ${{ secrets.SMTP_FROM }}
          body: |
            Android build and deployment completed successfully!
            Platform: Android
            Profile: ${{ github.event.inputs.profile }}
            Workflow: ${{ github.workflow }}
            Run: ${{ github.run_number }}
            Commit: ${{ github.sha }}
            Branch: ${{ github.ref_name }}
            Actor: ${{ github.actor }}
            View run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

      - name: Send failure email
        if: failure()
        continue-on-error: true
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: ${{ secrets.SMTP_SERVER }}
          server_port: ${{ secrets.SMTP_PORT }}
          username: ${{ secrets.SMTP_USERNAME }}
          password: ${{ secrets.SMTP_PASSWORD }}
          subject: '❌ Android Build & Deploy Failed - GrabDocs'
          to: dev@grabdocs.com
          from: ${{ secrets.SMTP_FROM }}
          body: |
            Android build or deployment failed!
            Platform: Android
            Profile: ${{ github.event.inputs.profile }}
            Workflow: ${{ github.workflow }}
            Run: ${{ github.run_number }}
            Commit: ${{ github.sha }}
            Branch: ${{ github.ref_name }}
            Actor: ${{ github.actor }}
            View run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
            Please check the workflow logs for details.
