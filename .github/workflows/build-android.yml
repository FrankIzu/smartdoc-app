# Build Android app with EAS local (no EAS cloud charge).
# Trigger: manual (workflow_dispatch) or push to main.
# Requires: GitHub secret EXPO_TOKEN (Expo access token).

name: Build Android (EAS local)

on:
  workflow_dispatch:
    inputs:
      profile:
        description: 'EAS profile'
        required: true
        default: 'production'
        type: choice
        options:
          - production
          - preview
          - development
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'manager-francis/**'
      - '.github/**'

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Setup EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Setup Android SDK (accept licenses non-interactively)
        run: |
          SDK_ROOT="/usr/local/lib/android/sdk"
          # Find sdkmanager (runner may use cmdline-tools/latest or cmdline-tools/12.0)
          SDKMANAGER=""
          for d in "$SDK_ROOT/cmdline-tools/latest/bin" "$SDK_ROOT/cmdline-tools/12.0/bin"; do
            if [ -x "$d/sdkmanager" ]; then SDKMANAGER="$d/sdkmanager"; break; fi
          done
          if [ -z "$SDKMANAGER" ]; then
            SDKMANAGER=$(find "$SDK_ROOT" -name sdkmanager -type f -executable 2>/dev/null | head -1)
          fi
          if [ -z "$SDKMANAGER" ]; then echo "sdkmanager not found in $SDK_ROOT"; exit 1; fi
          echo "Using $SDKMANAGER"
          export ANDROID_HOME="$SDK_ROOT"
          yes | "$SDKMANAGER" --licenses || true
          "$SDKMANAGER" "platform-tools" "platforms;android-34" "build-tools;34.0.0" "ndk;25.1.8937393"

      - name: Install dependencies
        run: npm ci

      - name: EAS Build (local)
        run: |
          PROFILE="${{ github.event.inputs.profile || 'production' }}"
          eas build --platform android --profile "$PROFILE" --local --non-interactive
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}

      - name: Upload Android artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-build
          path: |
            *.aab
            *.apk
          if-no-files-found: ignore
