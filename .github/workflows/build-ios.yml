# Build iOS app with EAS local (no EAS cloud charge).
# Trigger: manual (workflow_dispatch) only. Deploy script triggers the selected platform (iOS or Android) via gh workflow run after push.
# Requires: GitHub secret EXPO_TOKEN (Expo access token).
# Auto-submit: Submit job runs after build; if it fails, re-run failed jobs to retry only submit.
#   Requires: ASC_KEY_ID, ASC_ISSUER_ID, ASC_KEY_P8_BASE64 (or EXPO_APPLE_APP_SPECIFIC_PASSWORD) in GitHub Secrets.
# Runs on macOS (uses GitHub-hosted macOS runner).

name: Build iOS (EAS local)

on:
  workflow_dispatch:
    inputs:
      profile:
        description: 'EAS profile'
        required: true
        default: 'production'
        type: choice
        options:
          - production
          - preview
          - development

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout (exclude manager-francis; app build does not use it)
        uses: actions/checkout@v4
        with:
          submodules: false
          fetch-depth: 0
          sparse-checkout: |
            /*
            !manager-francis
          sparse-checkout-cone-mode: false

      - name: Remove manager-francis submodule entry so git cleanup does not fail
        run: |
          set +e
          # Remove submodule references
          git config -f .gitmodules --remove-section submodule.manager-francis 2>/dev/null || true
          git submodule deinit -f manager-francis 2>/dev/null || true
          git rm --cached manager-francis 2>/dev/null || true
          rm -rf .git/modules/manager-francis manager-francis 2>/dev/null || true
          # Ensure git is in a clean state
          git reset --hard HEAD 2>/dev/null || true
          git clean -fd 2>/dev/null || true
          # Verify git is working
          git status > /dev/null 2>&1 || echo "Warning: git status check failed, but continuing..."
        continue-on-error: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Setup EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install dependencies
        run: npm ci

      - name: Verify EAS credentials include extension target
        run: |
          # Fetch the credentials list from EAS and confirm that the broadcast extension
          # bundle ID (com.grabdocs.mobile.GrabDocsBroadcastUpload) has a provisioning
          # profile registered.  If it doesn't, the xcodebuild archive step will fail
          # with "No profiles for 'com.grabdocs.mobile.GrabDocsBroadcastUpload' were found".
          #
          # Fix: run  eas credentials --platform ios  locally, select the
          # GrabDocsBroadcastUpload target, and let EAS create/link a profile.
          set +e
          CREDS_OUTPUT=$(npx eas-cli credentials --platform ios 2>&1 || true)
          echo "$CREDS_OUTPUT" | head -60
          # A soft check — we grep for the extension bundle ID in whatever EAS outputs.
          # This is best-effort; real failure will surface clearly in the EAS build step.
          if echo "$CREDS_OUTPUT" | grep -q "GrabDocsBroadcastUpload"; then
            echo "✅ GrabDocsBroadcastUpload credentials appear to be configured in EAS"
          else
            echo "⚠️  Could not confirm EAS credentials for com.grabdocs.mobile.GrabDocsBroadcastUpload"
            echo "   If the build fails with 'No profiles for GrabDocsBroadcastUpload', run:"
            echo "     eas credentials --platform ios"
            echo "   This registers the extension App ID and provisioning profile with EAS."
          fi
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}

      # ios/ is in .easignore, so EAS will run prebuild. The plugin ios-hms-screenshare
      # creates the Broadcast Upload Extension and patches the Podfile (nested target).
      - name: Install extension provisioning profile (App Groups)
        id: ext_profile
        run: |
          # EAS local build does not install extension profiles; Xcode needs the
          # GrabDocsBroadcastUpload profile (with App Groups) so the extension target can sign.
          # The profile MUST have App Groups capability and include group.com.grabdocs.mobile.
          if [ -z "$EXT_PROVISIONING_PROFILE_BASE64" ]; then
            echo "::error::EXT_PROVISIONING_PROFILE_BASE64 secret is not set. Add the base64-encoded GrabDocsBroadcastUpload .mobileprovision (with App Groups) as a GitHub secret."
            exit 1
          fi
          PROFILE_DIR="$HOME/Library/MobileDevice/Provisioning Profiles"
          FALLBACK_UUID="f5a9c6da-0810-4a56-8963-3cb9894f83a1"
          mkdir -p "$PROFILE_DIR"
          echo "$EXT_PROVISIONING_PROFILE_BASE64" | tr -d '\n' | base64 --decode > /tmp/ext.mobileprovision
          if [ ! -s /tmp/ext.mobileprovision ]; then
            echo "::error::Failed to decode EXT_PROVISIONING_PROFILE_BASE64 (empty or invalid base64). Ensure the secret is a single line, no line breaks."
            exit 1
          fi
          UUID=$(security cms -D -i /tmp/ext.mobileprovision 2>/dev/null | /usr/libexec/PlistBuddy -c 'Print UUID' /dev/stdin 2>/dev/null || true)
          if [ -n "$UUID" ] && [ "${#UUID}" -eq 36 ] && echo "$UUID" | grep -qE '^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$'; then
            cp /tmp/ext.mobileprovision "$PROFILE_DIR/$UUID.mobileprovision"
            echo "✅ Installed extension profile: $UUID"
          else
            cp /tmp/ext.mobileprovision "$PROFILE_DIR/$FALLBACK_UUID.mobileprovision"
            echo "✅ Installed extension profile (fallback UUID: $FALLBACK_UUID)"
            UUID="$FALLBACK_UUID"
          fi
          # Fail fast if the profile does not have App Groups (required for extension signing).
          if ! security cms -D -i /tmp/ext.mobileprovision 2>/dev/null | /usr/libexec/PlistBuddy -c 'Print Entitlements:com.apple.security.application-groups' /dev/stdin 2>/dev/null | grep -q .; then
            echo "::error::The provisioning profile in EXT_PROVISIONING_PROFILE_BASE64 does NOT have App Groups. In Apple Developer: App ID com.grabdocs.mobile.GrabDocsBroadcastUpload -> Capabilities -> enable App Groups and add group.com.grabdocs.mobile. Then create a new provisioning profile and update the secret."
            exit 1
          fi
          echo "✅ Profile has App Groups entitlement"
          echo "EXT_PROVISIONING_PROFILE=/tmp/ext.mobileprovision" >> "$GITHUB_ENV"
          echo "EXT_PROFILE_UUID=$UUID" >> "$GITHUB_ENV"
        env:
          EXT_PROVISIONING_PROFILE_BASE64: ${{ secrets.EXT_PROVISIONING_PROFILE_BASE64 }}

      - name: Install CocoaPods
        run: sudo gem install cocoapods -v 1.15.2

      # Prebuild: plugin adds extension target, Embed phase, and main-target dependency (addTargetDependency).
      - name: Prebuild iOS
        run: npx expo prebuild --platform ios --clean --no-install

      - name: Verify Podfile and install Pods
        id: verify_pods
        run: |
          echo "===== XCODE TARGETS (for CocoaPods host relationship) ====="
          PBXPROJ=$(find ios -name "project.pbxproj" -path "*.xcodeproj/*" | head -1)
          if [ -n "$PBXPROJ" ]; then
            echo "File: $PBXPROJ"
            grep -n "GrabDocsBroadcastUpload" "$PBXPROJ" || echo "GrabDocsBroadcastUpload not found in project.pbxproj"
            echo "===== PBXNativeTarget sections ====="
            grep -n "PBXNativeTarget" "$PBXPROJ" || true
            echo "===== Embed App Extensions (main target) ====="
            grep -n "Embed App Extensions\|PBXCopyFilesBuildPhase" "$PBXPROJ" || true
          else
            echo "project.pbxproj not found under ios/"
          fi
          echo "===== Podfile (extension nested in target GrabDocs) ====="
          grep -n "GrabDocsBroadcastUpload\|target.*GrabDocs" ios/Podfile || true
          echo "----- FULL PODFILE -----"
          cat ios/Podfile
          echo "----- END PODFILE -----"
          cd ios && pod install --repo-update

      - name: Set extension provisioning profile UUID in project
        run: |
          # Plugin hardcodes a UUID; Xcode must use the actual UUID of the profile we installed.
          PBXPROJ=$(find ios -name "project.pbxproj" -path "*.xcodeproj/*" | head -1)
          if [ -z "$PBXPROJ" ] || [ ! -f /tmp/ext.mobileprovision ]; then
            echo "Skipping extension profile UUID patch (no project or no profile)"
            exit 0
          fi
          UUID=$(security cms -D -i /tmp/ext.mobileprovision 2>/dev/null | /usr/libexec/PlistBuddy -c 'Print UUID' /dev/stdin 2>/dev/null || true)
          if [ -z "$UUID" ] || [ "${#UUID}" -ne 36 ]; then
            echo "Could not extract UUID from extension profile; project will use plugin default."
            exit 0
          fi
          # Replace hardcoded extension PROVISIONING_PROFILE with the profile's real UUID (only in extension target context).
          sed -i '' "s/PROVISIONING_PROFILE = \"f5a9c6da-0810-4a56-8963-3cb9894f83a1\"/PROVISIONING_PROFILE = \"$UUID\"/g" "$PBXPROJ"
          echo "✅ Set extension PROVISIONING_PROFILE to $UUID"

      - name: EAS Build (local)
        id: eas_build
        continue-on-error: true
        run: |
          PROFILE="${{ github.event.inputs.profile || 'production' }}"
          eas build --platform ios --profile "$PROFILE" --local --non-interactive
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          EXT_PROVISIONING_PROFILE: /tmp/ext.mobileprovision
          EXT_PROFILE_UUID: ${{ env.EXT_PROFILE_UUID }}
          # Use runner HOME so the extension profile installed in step 1 is visible to xcodebuild.
          HOME: ${{ env.HOME || '/Users/runner' }}

      - name: Upload Podfile for debugging (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ios-podfile-debug
          path: |
            ios/Podfile
            ios/Podfile.properties.json
            ios/GrabDocs.xcodeproj/project.pbxproj
          if-no-files-found: ignore

      - name: Dump Podfile and pod logs on failure (diagnosis)
        if: failure()
        run: |
          echo "===== PODFILE (from repo or EAS build dir) ====="
          if [ -f ios/Podfile ]; then
            cat ios/Podfile
          else
            PODFILE_PATH=$(find /var/folders /Users/runner /tmp -name "Podfile" -path "*/ios/Podfile" -not -path "*/node_modules/*" 2>/dev/null | head -1)
            if [ -n "$PODFILE_PATH" ]; then
              echo "Found: $PODFILE_PATH"
              cat "$PODFILE_PATH"
            else
              echo "(ios/Podfile not found — EAS runs prebuild in a temp dir; repo has ios/ in .easignore)"
              find /var/folders /Users/runner /tmp -name "Podfile" 2>/dev/null | head -5 || true
            fi
          fi
          echo "===== EAS build logs (pod install phase) ====="
          find /var/folders /Users/runner /tmp -path "*eas-build*" -name "*.log" 2>/dev/null | head -5 | while read f; do echo "--- $f ---"; tail -200 "$f" 2>/dev/null | grep -A 5 -B 2 -i "pod\|CocoaPods\|error\|Unable" || tail -50 "$f"; done || true
          echo "=============================================="

      - name: Upload Xcode build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xcode-build-logs
          path: /tmp/eas-build-local-nodejs/**/logs/*.log
          if-no-files-found: ignore

      - name: Fail if EAS build failed
        if: steps.eas_build.outcome == 'failure'
        run: exit 1

      - name: Upload iOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: ios-build
          path: |
            *.ipa
          if-no-files-found: ignore

  submit:
    needs: build
    runs-on: macos-latest
    if: github.event.inputs.profile == 'production'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: false
          sparse-checkout: |
            /*
            !manager-francis
          sparse-checkout-cone-mode: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Download iOS artifact
        uses: actions/download-artifact@v4
        with:
          name: ios-build

      - name: Submit to App Store
        run: |
          HAS_ASC=$([ -n "$ASC_KEY_ID" ] && [ -n "$ASC_ISSUER_ID" ] && [ -n "$ASC_KEY_P8_BASE64" ]; echo $?)
          HAS_PASSWORD=$([ -n "$EXPO_APPLE_APP_SPECIFIC_PASSWORD" ]; echo $?)
          if [ "$HAS_ASC" -ne 0 ] && [ "$HAS_PASSWORD" -ne 0 ]; then
            echo "::error::No Apple credentials set. Add ASC_KEY_ID, ASC_ISSUER_ID, ASC_KEY_P8_BASE64 or EXPO_APPLE_APP_SPECIFIC_PASSWORD to GitHub Secrets."
            exit 1
          fi
          IPA=$(find . -maxdepth 5 -name "*.ipa" -type f 2>/dev/null | head -1)
          if [ -z "$IPA" ]; then
            echo "::error::No .ipa file found in artifact"
            exit 1
          fi
          # Swap to plugin-free config so EAS submit doesn't resolve expo-dev-client
          # (avoids "Failed to resolve plugin for module expo-dev-client")
          cp app.config.js app.config.js.bak
          cp app.config.submit.js app.config.js
          trap 'mv -f app.config.js.bak app.config.js' EXIT
          echo "Submitting iOS app to App Store Connect..."
          if [ -n "$ASC_KEY_ID" ] && [ -n "$ASC_ISSUER_ID" ] && [ -n "$ASC_KEY_P8_BASE64" ]; then
            echo "Using App Store Connect API keys"
            echo "$ASC_KEY_P8_BASE64" | base64 -d > /tmp/asc-key.p8
            chmod 600 /tmp/asc-key.p8
            if command -v jq &> /dev/null; then
              jq --arg path "/tmp/asc-key.p8" --arg kid "$ASC_KEY_ID" --arg iid "$ASC_ISSUER_ID" '.submit.production.ios.ascApiKeyPath = $path | .submit.production.ios.ascApiKeyId = $kid | .submit.production.ios.ascApiKeyIssuerId = $iid' eas.json > eas.json.tmp && mv eas.json.tmp eas.json
            else
              printf 'import json\nimport os\n\nwith open("eas.json", "r") as f:\n    config = json.load(f)\n\nconfig["submit"]["production"]["ios"]["ascApiKeyPath"] = "/tmp/asc-key.p8"\nconfig["submit"]["production"]["ios"]["ascApiKeyId"] = os.environ["ASC_KEY_ID"]\nconfig["submit"]["production"]["ios"]["ascApiKeyIssuerId"] = os.environ["ASC_ISSUER_ID"]\n\nwith open("eas.json", "w") as f:\n    json.dump(config, f, indent=2)\n' > /tmp/update_eas.py
              python3 /tmp/update_eas.py
            fi
            npx eas-cli submit --platform ios --path "$IPA" --profile production --non-interactive
          else
            echo "Using app-specific password"
            npx eas-cli submit --platform ios --path "$IPA" --profile production --non-interactive
          fi
          echo "✅ Successfully submitted to App Store Connect!"
        env:
          CI: "true"
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8_BASE64: ${{ secrets.ASC_KEY_P8_BASE64 }}
          EXPO_APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.EXPO_APPLE_APP_SPECIFIC_PASSWORD }}

      - name: Send success email
        if: success()
        continue-on-error: true
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: ${{ secrets.SMTP_SERVER }}
          server_port: ${{ secrets.SMTP_PORT }}
          username: ${{ secrets.SMTP_USERNAME }}
          password: ${{ secrets.SMTP_PASSWORD }}
          subject: '✅ iOS Build & Deploy Successful - GrabDocs'
          to: dev@grabdocs.com
          from: ${{ secrets.SMTP_FROM }}
          body: |
            iOS build and deployment completed successfully!
            Platform: iOS
            Profile: ${{ github.event.inputs.profile }}
            Workflow: ${{ github.workflow }}
            Run: ${{ github.run_number }}
            Commit: ${{ github.sha }}
            Branch: ${{ github.ref_name }}
            Actor: ${{ github.actor }}
            View run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

      - name: Send failure email
        if: failure()
        continue-on-error: true
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: ${{ secrets.SMTP_SERVER }}
          server_port: ${{ secrets.SMTP_PORT }}
          username: ${{ secrets.SMTP_USERNAME }}
          password: ${{ secrets.SMTP_PASSWORD }}
          subject: '❌ iOS Build & Deploy Failed - GrabDocs'
          to: dev@grabdocs.com
          from: ${{ secrets.SMTP_FROM }}
          body: |
            iOS build or deployment failed!
            Platform: iOS
            Profile: ${{ github.event.inputs.profile }}
            Workflow: ${{ github.workflow }}
            Run: ${{ github.run_number }}
            Commit: ${{ github.sha }}
            Branch: ${{ github.ref_name }}
            Actor: ${{ github.actor }}
            View run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
            Please check the workflow logs for details.
