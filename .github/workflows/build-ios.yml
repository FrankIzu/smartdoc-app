# Build iOS app with EAS local (no EAS cloud charge).
# Trigger: manual (workflow_dispatch) only. Deploy script triggers the selected platform (iOS or Android) via gh workflow run after push.
# Requires: GitHub secret EXPO_TOKEN (Expo access token).
# Auto-submit: Submit job runs after build; if it fails, re-run failed jobs to retry only submit.
#   Requires: ASC_KEY_ID, ASC_ISSUER_ID, ASC_KEY_P8_BASE64 (or EXPO_APPLE_APP_SPECIFIC_PASSWORD) in GitHub Secrets.
# Runs on macOS (uses GitHub-hosted macOS runner).

name: Build iOS (EAS local)

on:
  workflow_dispatch:
    inputs:
      profile:
        description: 'EAS profile'
        required: true
        default: 'production'
        type: choice
        options:
          - production
          - preview
          - development
      force_prebuild:
        description: 'Regenerate ios folder (run prebuild) before building. Use after changing app config or plugins.'
        required: false
        default: false
        type: boolean

jobs:
  ensure-ios:
    runs-on: macos-latest
    permissions:
      contents: write
    outputs:
      did_prebuild: ${{ steps.need_prebuild.outputs.need }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: false
          sparse-checkout: |
            /*
            !manager-francis
          sparse-checkout-cone-mode: false

      - name: Remove manager-francis submodule entry
        run: |
          set +e
          git config -f .gitmodules --remove-section submodule.manager-francis 2>/dev/null || true
          git submodule deinit -f manager-francis 2>/dev/null || true
          git rm --cached manager-francis 2>/dev/null || true
          rm -rf .git/modules/manager-francis manager-francis 2>/dev/null || true
          git reset --hard HEAD 2>/dev/null || true
          git clean -fd 2>/dev/null || true
        continue-on-error: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Setup EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install dependencies
        run: npm ci

      - name: Check if prebuild needed
        id: need_prebuild
        run: |
          if [ "${{ github.event.inputs.force_prebuild }}" = "true" ]; then
            echo "need=true" >> $GITHUB_OUTPUT
            echo "Force prebuild requested"
            exit 0
          fi
          if [ ! -d "ios" ] || [ ! -f "ios/GrabDocs.xcodeproj/project.pbxproj" ]; then
            echo "need=true" >> $GITHUB_OUTPUT
            echo "ios folder missing or incomplete"
            exit 0
          fi
          echo "need=false" >> $GITHUB_OUTPUT
          echo "ios folder present, skipping prebuild"

      - name: Run prebuild and push ios
        if: steps.need_prebuild.outputs.need == 'true'
        run: |
          npx expo prebuild --platform ios --clean --no-install
          node scripts/patch-ios-podfile-broadcast.js
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add ios/
          if git diff --staged --quiet; then
            echo "No ios changes to commit"
            exit 0
          fi
          git commit -m "chore(ios): regenerate ios folder via prebuild"
          BRANCH="${GITHUB_REF#refs/heads/}"
          git pull origin "$BRANCH" --rebase
          git push origin "$BRANCH"

  build:
    needs: ensure-ios
    runs-on: macos-latest
    steps:
      - name: Checkout (exclude manager-francis; app build does not use it)
        uses: actions/checkout@v4
        with:
          submodules: false
          fetch-depth: 0
          sparse-checkout: |
            /*
            !manager-francis
          sparse-checkout-cone-mode: false

      - name: Pull latest (get prebuilt ios if ensure-ios pushed)
        run: |
          git pull origin ${{ github.ref_name }} --ff-only || true

      - name: Remove manager-francis submodule entry so git cleanup does not fail
        run: |
          set +e
          # Remove submodule references
          git config -f .gitmodules --remove-section submodule.manager-francis 2>/dev/null || true
          git submodule deinit -f manager-francis 2>/dev/null || true
          git rm --cached manager-francis 2>/dev/null || true
          rm -rf .git/modules/manager-francis manager-francis 2>/dev/null || true
          # Ensure git is in a clean state
          git reset --hard HEAD 2>/dev/null || true
          git clean -fd 2>/dev/null || true
          # Verify git is working
          git status > /dev/null 2>&1 || echo "Warning: git status check failed, but continuing..."
        continue-on-error: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Setup EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install dependencies
        run: npm ci

      - name: Patch Podfile for broadcast extension host target
        run: node scripts/patch-ios-podfile-broadcast.js

      - name: Verify Podfile has nested broadcast target
        run: |
          if [ -f ios/Podfile ]; then
            if ! grep -q "target 'GrabDocsBroadcastUpload' do" ios/Podfile || ! grep -q "inherit! :search_paths" ios/Podfile; then
              echo "::error::Podfile missing nested GrabDocsBroadcastUpload target (host target). Run with force_prebuild=true or ensure patch ran."
              grep -n "target " ios/Podfile || true
              exit 1
            fi
            echo "Podfile contains nested broadcast extension target."
          fi

      - name: Commit patched Podfile so EAS archive includes it
        run: |
          if [ -f ios/Podfile ] && ! git diff --quiet ios/Podfile 2>/dev/null; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add ios/Podfile
            git commit -m "chore(ios): patch Podfile for broadcast extension host target" --no-verify
          fi

      - name: EAS Build (local)
        run: |
          PROFILE="${{ github.event.inputs.profile || 'production' }}"
          eas build --platform ios --profile "$PROFILE" --local --non-interactive
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}

      - name: Upload iOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: ios-build
          path: |
            *.ipa
          if-no-files-found: ignore

  submit:
    needs: build
    runs-on: macos-latest
    if: github.event.inputs.profile == 'production'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: false
          sparse-checkout: |
            /*
            !manager-francis
          sparse-checkout-cone-mode: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Download iOS artifact
        uses: actions/download-artifact@v4
        with:
          name: ios-build

      - name: Submit to App Store
        run: |
          HAS_ASC=$([ -n "$ASC_KEY_ID" ] && [ -n "$ASC_ISSUER_ID" ] && [ -n "$ASC_KEY_P8_BASE64" ]; echo $?)
          HAS_PASSWORD=$([ -n "$EXPO_APPLE_APP_SPECIFIC_PASSWORD" ]; echo $?)
          if [ "$HAS_ASC" -ne 0 ] && [ "$HAS_PASSWORD" -ne 0 ]; then
            echo "::error::No Apple credentials set. Add ASC_KEY_ID, ASC_ISSUER_ID, ASC_KEY_P8_BASE64 or EXPO_APPLE_APP_SPECIFIC_PASSWORD to GitHub Secrets."
            exit 1
          fi
          IPA=$(find . -maxdepth 5 -name "*.ipa" -type f 2>/dev/null | head -1)
          if [ -z "$IPA" ]; then
            echo "::error::No .ipa file found in artifact"
            exit 1
          fi
          # Swap to plugin-free config so EAS submit doesn't resolve expo-dev-client
          # (avoids "Failed to resolve plugin for module expo-dev-client")
          cp app.config.js app.config.js.bak
          cp app.config.submit.js app.config.js
          trap 'mv -f app.config.js.bak app.config.js' EXIT
          echo "Submitting iOS app to App Store Connect..."
          if [ -n "$ASC_KEY_ID" ] && [ -n "$ASC_ISSUER_ID" ] && [ -n "$ASC_KEY_P8_BASE64" ]; then
            echo "Using App Store Connect API keys"
            echo "$ASC_KEY_P8_BASE64" | base64 -d > /tmp/asc-key.p8
            chmod 600 /tmp/asc-key.p8
            if command -v jq &> /dev/null; then
              jq --arg path "/tmp/asc-key.p8" --arg kid "$ASC_KEY_ID" --arg iid "$ASC_ISSUER_ID" '.submit.production.ios.ascApiKeyPath = $path | .submit.production.ios.ascApiKeyId = $kid | .submit.production.ios.ascApiKeyIssuerId = $iid' eas.json > eas.json.tmp && mv eas.json.tmp eas.json
            else
              printf 'import json\nimport os\n\nwith open("eas.json", "r") as f:\n    config = json.load(f)\n\nconfig["submit"]["production"]["ios"]["ascApiKeyPath"] = "/tmp/asc-key.p8"\nconfig["submit"]["production"]["ios"]["ascApiKeyId"] = os.environ["ASC_KEY_ID"]\nconfig["submit"]["production"]["ios"]["ascApiKeyIssuerId"] = os.environ["ASC_ISSUER_ID"]\n\nwith open("eas.json", "w") as f:\n    json.dump(config, f, indent=2)\n' > /tmp/update_eas.py
              python3 /tmp/update_eas.py
            fi
            npx eas-cli submit --platform ios --path "$IPA" --profile production --non-interactive
          else
            echo "Using app-specific password"
            npx eas-cli submit --platform ios --path "$IPA" --profile production --non-interactive
          fi
          echo "✅ Successfully submitted to App Store Connect!"
        env:
          CI: "true"
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8_BASE64: ${{ secrets.ASC_KEY_P8_BASE64 }}
          EXPO_APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.EXPO_APPLE_APP_SPECIFIC_PASSWORD }}

      - name: Send success email
        if: success()
        continue-on-error: true
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: ${{ secrets.SMTP_SERVER }}
          server_port: ${{ secrets.SMTP_PORT }}
          username: ${{ secrets.SMTP_USERNAME }}
          password: ${{ secrets.SMTP_PASSWORD }}
          subject: '✅ iOS Build & Deploy Successful - GrabDocs'
          to: dev@grabdocs.com
          from: ${{ secrets.SMTP_FROM }}
          body: |
            iOS build and deployment completed successfully!
            Platform: iOS
            Profile: ${{ github.event.inputs.profile }}
            Workflow: ${{ github.workflow }}
            Run: ${{ github.run_number }}
            Commit: ${{ github.sha }}
            Branch: ${{ github.ref_name }}
            Actor: ${{ github.actor }}
            View run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

      - name: Send failure email
        if: failure()
        continue-on-error: true
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: ${{ secrets.SMTP_SERVER }}
          server_port: ${{ secrets.SMTP_PORT }}
          username: ${{ secrets.SMTP_USERNAME }}
          password: ${{ secrets.SMTP_PASSWORD }}
          subject: '❌ iOS Build & Deploy Failed - GrabDocs'
          to: dev@grabdocs.com
          from: ${{ secrets.SMTP_FROM }}
          body: |
            iOS build or deployment failed!
            Platform: iOS
            Profile: ${{ github.event.inputs.profile }}
            Workflow: ${{ github.workflow }}
            Run: ${{ github.run_number }}
            Commit: ${{ github.sha }}
            Branch: ${{ github.ref_name }}
            Actor: ${{ github.actor }}
            View run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
            Please check the workflow logs for details.
