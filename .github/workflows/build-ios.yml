# Build iOS app with EAS local (no EAS cloud charge).
# Trigger: manual (workflow_dispatch) only. Deploy script triggers the selected platform (iOS or Android) via gh workflow run after push.
# Requires: GitHub secret EXPO_TOKEN (Expo access token).
# Auto-submit: Submit job runs after build; if it fails, re-run failed jobs to retry only submit.
#   Requires: ASC_KEY_ID, ASC_ISSUER_ID, ASC_KEY_P8_BASE64 (or EXPO_APPLE_APP_SPECIFIC_PASSWORD) in GitHub Secrets.
# Runs on macOS (uses GitHub-hosted macOS runner).

name: Build iOS (EAS local)

on:
  workflow_dispatch:
    inputs:
      profile:
        description: 'EAS profile'
        required: true
        default: 'production'
        type: choice
        options:
          - production
          - preview
          - development

jobs:
  build:
    runs-on: macos-26
    steps:
      - name: Checkout (exclude manager-francis; app build does not use it)
        uses: actions/checkout@v4
        with:
          submodules: false
          fetch-depth: 0
          sparse-checkout: |
            /*
            !manager-francis
          sparse-checkout-cone-mode: false

      - name: Remove manager-francis submodule entry so git cleanup does not fail
        run: |
          set +e
          # Remove submodule references
          git config -f .gitmodules --remove-section submodule.manager-francis 2>/dev/null || true
          git submodule deinit -f manager-francis 2>/dev/null || true
          git rm --cached manager-francis 2>/dev/null || true
          rm -rf .git/modules/manager-francis manager-francis 2>/dev/null || true
          # Ensure git is in a clean state
          git reset --hard HEAD 2>/dev/null || true
          git clean -fd 2>/dev/null || true
          # Verify git is working
          git status > /dev/null 2>&1 || echo "Warning: git status check failed, but continuing..."
        continue-on-error: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Setup EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install dependencies
        run: npm ci

      # Signing strategy: EAS provides the main app profile (Manual). The extension profile is
      # installed from EXT_PROVISIONING_PROFILE_BASE64 (GitHub secret) inside the EAS build step,
      # after eas/configure_ios_credentials, so EAS cannot override it.

      - name: Install CocoaPods
        run: sudo gem install cocoapods -v 1.15.2

      # Use version and buildNumber from app.versions.json (set by deploy.ps1 before triggering this workflow).
      # Prebuild: plugin adds extension target, Embed phase, and main-target dependency (addTargetDependency).
      - name: Prebuild iOS
        run: npx expo prebuild --platform ios --clean --no-install

      - name: Ensure Podfile extension block (safety net)
        run: node scripts/ensure-podfile-extension.js

      - name: Ensure pbxproj Embed App Extensions phase (CocoaPods host)
        run: node scripts/ensure-pbxproj-embed-phase.js

      - name: Verify Podfile and install Pods
        id: verify_pods
        run: |
          echo "===== XCODE TARGETS (for CocoaPods host relationship) ====="
          PBXPROJ=$(find ios -name "project.pbxproj" -path "*.xcodeproj/*" | head -1)
          if [ -n "$PBXPROJ" ]; then
            echo "File: $PBXPROJ"
            grep -n "GrabDocsBroadcastUpload" "$PBXPROJ" || echo "GrabDocsBroadcastUpload not found in project.pbxproj"
            echo "===== PBXNativeTarget sections ====="
            grep -n "PBXNativeTarget" "$PBXPROJ" || true
            echo "===== Embed App Extensions (main target) ====="
            grep -n "Embed App Extensions\|PBXCopyFilesBuildPhase" "$PBXPROJ" || true
            echo "===== Main target dependencies (CocoaPods host) ====="
            grep -n "dependencies =\|GrabDocsBroadcastUpload" "$PBXPROJ" | head -20 || true
          else
            echo "project.pbxproj not found under ios/"
          fi
          echo "===== Podfile (extension nested in target GrabDocs) ====="
          grep -n "GrabDocsBroadcastUpload\|target.*GrabDocs" ios/Podfile || true
          echo "----- FULL PODFILE -----"
          cat ios/Podfile
          echo "----- END PODFILE -----"
          cd ios && pod install --repo-update

      - name: Dump extension signing state before EAS build
        run: |
          PBXPROJ=$(find ios -name "project.pbxproj" -path "*.xcodeproj/*" | head -1)
          if [ -n "$PBXPROJ" ]; then
            echo "===== Extension XCBuildConfiguration (expect CODE_SIGN_STYLE = Automatic) ====="
            grep -A 20 "GrabDocsBroadcastUpload" "$PBXPROJ" | grep -E "CODE_SIGN_STYLE|PROVISIONING_PROFILE|DEVELOPMENT_TEAM|CODE_SIGN_IDENTITY" || echo "(none found)"
          fi

      - name: Verify signing settings (plugin worked)
        run: |
          PBXPROJ=$(find ios -name "project.pbxproj" -path "*.xcodeproj/*" | head -1)
          if [ -z "$PBXPROJ" ]; then
            echo "project.pbxproj not found, skipping"
            exit 0
          fi
          echo "===== CODE_SIGN / PROVISIONING_PROFILE / DEVELOPMENT_TEAM in project.pbxproj ====="
          grep -E "CODE_SIGN|PROVISIONING_PROFILE|DEVELOPMENT_TEAM" "$PBXPROJ" || true
          echo "===== Expect: CODE_SIGN_STYLE = Automatic; DEVELOPMENT_TEAM = ... ====="
          echo "===== Must NOT see: PROVISIONING_PROFILE, PROVISIONING_PROFILE_SPECIFIER, CODE_SIGN_IDENTITY ====="
          if grep -E "^\s*PROVISIONING_PROFILE\s*=|^\s*PROVISIONING_PROFILE_SPECIFIER\s*=|^\s*CODE_SIGN_IDENTITY\s*=" "$PBXPROJ" 2>/dev/null; then
            echo "::error::Manual signing keys still present; plugin may not have run or was overwritten."
            exit 1
          fi
          echo "✅ No manual signing keys found"

      # Re-apply pbxproj fix and verify before EAS (patched ios/ is used; no prebuildCommand).
      - name: Re-apply pbxproj undefined fix (before EAS)
        run: node scripts/ensure-pbxproj-embed-phase.js

      # Belt-and-suspenders: sed replace any remaining "undefined" (pod install may re-introduce).
      - name: Force-remove undefined from project.pbxproj
        run: |
          PBXPROJ=$(find ios -name "project.pbxproj" -path "*.xcodeproj/*" | head -1)
          if [ -z "$PBXPROJ" ]; then
            echo "project.pbxproj not found"
            exit 0
          fi
          if grep -q " = undefined" "$PBXPROJ"; then
            echo "Found undefined in project.pbxproj, applying fixes (file types are fixed by ensure-pbxproj-embed-phase.js)..."
            sed -i '' 's/fileEncoding = undefined/fileEncoding = 4/g' "$PBXPROJ"
            sed -i '' 's/includeInIndex = undefined/includeInIndex = 0/g' "$PBXPROJ"
            # Fix remoteGlobalIDString FIRST (before catch-all) — EAS fails with "target with id 'undefined'" otherwise
            EXT_UUID=$(sed -n '/Begin PBXNativeTarget/,/End PBXNativeTarget/p' "$PBXPROJ" | grep '"GrabDocsBroadcastUpload"' | head -1 | grep -oE '[0-9A-F]{24}' | head -1)
            if [ -n "$EXT_UUID" ] && grep -q "remoteGlobalIDString = undefined" "$PBXPROJ"; then
              sed -i '' "s/remoteGlobalIDString = undefined/remoteGlobalIDString = $EXT_UUID/g" "$PBXPROJ"
              echo "   Fixed remoteGlobalIDString with extension UUID $EXT_UUID"
            fi
            # Catch-all: any remaining key = undefined
            sed -i '' -E 's/([a-zA-Z0-9_]+) = undefined/\1 = ""/g' "$PBXPROJ"
            echo "✅ Force-removed undefined from project.pbxproj"
          else
            echo "No undefined in project.pbxproj"
          fi

      - name: Verify no undefined in project.pbxproj
        run: |
          PBXPROJ=$(find ios -name "project.pbxproj" -path "*.xcodeproj/*" | head -1)
          if [ -z "$PBXPROJ" ]; then
            echo "::error::project.pbxproj not found"
            exit 1
          fi
          if grep -qE " = undefined|= undefined" "$PBXPROJ"; then
            echo "::error::project.pbxproj still contains literal 'undefined'"
            grep -nE " = undefined|= undefined" "$PBXPROJ" || true
            exit 1
          fi
          echo "✅ No literal undefined in project.pbxproj"

      - name: Dump PBXTargetDependency section (debug)
        run: |
          PBXPROJ=$(find ios -name "project.pbxproj" -path "*.xcodeproj/*" | head -1)
          if [ -n "$PBXPROJ" ]; then
            echo "===== PBXTargetDependency section ====="
            sed -n '/Begin PBXTargetDependency/,/End PBXTargetDependency/p' "$PBXPROJ" || true
            echo "===== PBXContainerItemProxy section ====="
            sed -n '/Begin PBXContainerItemProxy/,/End PBXContainerItemProxy/p' "$PBXPROJ" || true
          fi

      # Force version and buildNumber from app.versions.json into ios/ so the IPA matches the repo (Apple was seeing older values).
      - name: Sync version and build number from app.versions.json into iOS project
        run: |
          V=$(node -e "const j=require('./app.versions.json'); console.log(j.version||'1.0.0');")
          B=$(node -e "const j=require('./app.versions.json'); console.log(j.ios?.buildNumber||'1');")
          PBXPROJ=$(find ios -name "project.pbxproj" -path "*.xcodeproj/*" | head -1)
          if [ -n "$PBXPROJ" ]; then
            sed -i '' "s/MARKETING_VERSION = [^;]*/MARKETING_VERSION = $V/g" "$PBXPROJ"
            sed -i '' "s/CURRENT_PROJECT_VERSION = [0-9]*/CURRENT_PROJECT_VERSION = $B/g" "$PBXPROJ"
            echo "Synced version=$V buildNumber=$B into $PBXPROJ"
            grep -E "MARKETING_VERSION|CURRENT_PROJECT_VERSION" "$PBXPROJ" | head -10
          fi

      # Final undefined fix before EAS reads project (EAS fails with "target with id 'undefined'" otherwise).
      - name: Final undefined fix in project.pbxproj (before EAS)
        run: |
          node scripts/ensure-pbxproj-embed-phase.js
          PBXPROJ=$(find ios -name "project.pbxproj" -path "*.xcodeproj/*" | head -1)
          [ -z "$PBXPROJ" ] && exit 0
          # Extension UUID: try with quotes then without (GrabDocsBroadcastUpload)
          EXT_UUID=$(sed -n '/Begin PBXNativeTarget/,/End PBXNativeTarget/p' "$PBXPROJ" | grep -E '"GrabDocsBroadcastUpload"|GrabDocsBroadcastUpload' | head -1 | grep -oE '[0-9A-F]{24}' | head -1)
          if [ -n "$EXT_UUID" ] && grep -q "remoteGlobalIDString = undefined" "$PBXPROJ"; then
            sed -i '' "s/remoteGlobalIDString = undefined/remoteGlobalIDString = $EXT_UUID/g" "$PBXPROJ"
            echo "Fixed remoteGlobalIDString = $EXT_UUID"
          fi
          # Wipe any remaining " = undefined" (remoteGlobalIDString already fixed above)
          if grep -q " = undefined" "$PBXPROJ"; then
            sed -i '' 's/fileEncoding = undefined/fileEncoding = 4/g' "$PBXPROJ"
            sed -i '' 's/includeInIndex = undefined/includeInIndex = 0/g' "$PBXPROJ"
            sed -i '' -E 's/([a-zA-Z0-9_]+) = undefined/\1 = ""/g' "$PBXPROJ"
            echo "Replaced remaining undefined"
          fi
          grep -qE " = undefined" "$PBXPROJ" && (echo "::error::undefined still present"; grep -n "undefined" "$PBXPROJ" | head -20; exit 1) || echo "✅ No undefined in project.pbxproj"

      - name: Diagnose project.pbxproj (Expo parse simulation)
        run: node scripts/diagnose-pbxproj-targets.js
        continue-on-error: true

      - name: EAS Build (local)
        id: eas_build
        continue-on-error: true
        run: |
          PROFILE="${{ github.event.inputs.profile || 'production' }}"
          echo "Running EAS build with DEBUG=* for verbose logs..."
          export EAS_LOCAL_BUILD_SKIP_CLEANUP=1
          export EAS_LOCAL_BUILD_WORKINGDIR="$GITHUB_WORKSPACE/eas-build"
          mkdir -p "$EAS_LOCAL_BUILD_WORKINGDIR"
          eas build --platform ios --profile "$PROFILE" --local --non-interactive 2>&1 | tee "$RUNNER_TEMP/eas-build.log"
          exit "${PIPESTATUS[0]:-0}"
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          EAS_DANGEROUS_OVERRIDE_IOS_BUNDLE_IDENTIFIER: "com.grabdocs.mobile"
          HOME: ${{ env.HOME || '/Users/runner' }}
          EXPO_DEBUG: "1"
          EXT_PROVISIONING_PROFILE_BASE64: ${{ secrets.EXT_PROVISIONING_PROFILE_BASE64 }}

      - name: Upload Podfile for debugging (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ios-podfile-debug
          path: |
            ios/Podfile
            ios/Podfile.properties.json
            ios/GrabDocs.xcodeproj/project.pbxproj
          if-no-files-found: ignore

      - name: Diagnose eas-build project (on failure)
        if: failure()
        run: |
          if [ -d "eas-build/ios" ]; then
            echo "===== eas-build/ios project (what EAS may have parsed) ====="
            node scripts/diagnose-pbxproj-targets.js eas-build/ios 2>&1 || true
          else
            echo "eas-build/ios not found (EAS may parse from workspace before copy)"
          fi
        continue-on-error: true

      - name: Extract and show build error from EAS log (on failure)
        if: failure()
        run: |
          LOG="$RUNNER_TEMP/eas-build.log"
          if [ ! -f "$LOG" ]; then
            echo "(eas-build.log not found)"
            exit 0
          fi
          echo "===== Likely failure (grep for error / fail / undefined) ====="
          grep -n -E "error:|Error:|❌|ARCHIVE FAILED|Undefined symbols|ld: symbol|Code signing|Process crashed|exit code: [1-9]|non-zero code" "$LOG" | tail -80 || true
          echo ""
          echo "===== Last 250 lines of EAS build log ====="
          tail -250 "$LOG"
        continue-on-error: true

      - name: Upload EAS full build log (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: eas-build-full-log
          path: ${{ runner.temp }}/eas-build.log
          if-no-files-found: ignore

      - name: Upload EAS build logs (on failure)
        if: failure()
        run: |
          LOGDIR=$(find /var/folders /tmp -type d -name "eas-build-local-nodejs" 2>/dev/null | head -1)
          if [ -n "$LOGDIR" ] && [ -d "$LOGDIR" ]; then
            echo "Found EAS build dir: $LOGDIR"
            find "$LOGDIR" -name "*.log" -type f 2>/dev/null | head -20
          fi
        continue-on-error: true

      - name: Dump Podfile and pod logs on failure (diagnosis)
        if: failure()
        run: |
          echo "===== PODFILE (from repo or EAS build dir) ====="
          if [ -f ios/Podfile ]; then
            cat ios/Podfile
          else
            PODFILE_PATH=$(find /var/folders /Users/runner /tmp -name "Podfile" -path "*/ios/Podfile" -not -path "*/node_modules/*" 2>/dev/null | head -1)
            if [ -n "$PODFILE_PATH" ]; then
              echo "Found: $PODFILE_PATH"
              cat "$PODFILE_PATH"
            else
              echo "(ios/Podfile not found — EAS runs prebuild in a temp dir; repo has ios/ in .easignore)"
              find /var/folders /Users/runner /tmp -name "Podfile" 2>/dev/null | head -5 || true
            fi
          fi
          echo "===== EAS build logs (pod install phase) ====="
          find /var/folders /Users/runner /tmp -path "*eas-build*" -name "*.log" 2>/dev/null | head -5 | while read f; do echo "--- $f ---"; tail -200 "$f" 2>/dev/null | grep -A 5 -B 2 -i "pod\|CocoaPods\|error\|Unable" || tail -50 "$f"; done || true
          echo "=============================================="

      - name: Upload Xcode build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xcode-build-logs
          path: /tmp/eas-build-local-nodejs/**/logs/*.log
          if-no-files-found: ignore

      - name: Fail if EAS build failed
        if: steps.eas_build.outcome == 'failure'
        run: exit 1

      - name: Upload iOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: ios-build
          path: |
            *.ipa
          if-no-files-found: ignore

      # dSYM for symbolication: EAS working dir is $GITHUB_WORKSPACE/eas-build; xcarchive may be in project subdir or Xcode default Archives.
      - name: Collect and upload iOS dSYM
        if: success()
        run: |
          DSYM_DIR="$RUNNER_TEMP/ios-dsym"
          mkdir -p "$DSYM_DIR"
          echo "===== Searching for xcarchive and dSYM ====="
          # 1) Fixed EAS working dir (we set EAS_LOCAL_BUILD_WORKINGDIR=eas-build)
          if [ -d "eas-build" ]; then
            echo "Listing eas-build:"
            find eas-build -maxdepth 4 -type d \( -name "*.xcarchive" -o -name "dSYMs" -o -name "*.dSYM" \) 2>/dev/null || true
            find eas-build -name "*.xcarchive" -type d 2>/dev/null | while read -r archive; do
              if [ -d "$archive/dSYMs" ]; then
                echo "Copying dSYMs from $archive"
                cp -R "$archive/dSYMs/"* "$DSYM_DIR/" 2>/dev/null || true
              fi
            done
            find eas-build -name "*.dSYM" -type d 2>/dev/null | head -5 | while read -r d; do cp -R "$d" "$DSYM_DIR/" 2>/dev/null; done
          fi
          # 2) Xcode default archive location (EAS may export there)
          if [ -d "$HOME/Library/Developer/Xcode/Archives" ]; then
            echo "Listing Xcode Archives (newest first):"
            find "$HOME/Library/Developer/Xcode/Archives" -name "*.xcarchive" -type d -mmin -120 2>/dev/null | head -3
            find "$HOME/Library/Developer/Xcode/Archives" -name "*.xcarchive" -type d -mmin -120 2>/dev/null | head -1 | while read -r archive; do
              if [ -d "$archive/dSYMs" ]; then
                echo "Copying dSYMs from $archive"
                cp -R "$archive/dSYMs/"* "$DSYM_DIR/" 2>/dev/null || true
              fi
            done
          fi
          # 3) Workspace root (IPA is here; dSYM sometimes next to it)
          find "$GITHUB_WORKSPACE" -maxdepth 3 -name "*.dSYM" -type d 2>/dev/null | while read -r d; do cp -R "$d" "$DSYM_DIR/" 2>/dev/null; done
          # 4) ios/build from prebuild
          if [ -d "ios/build" ]; then
            find ios/build -name "*.dSYM" -type d -exec cp -R {} "$DSYM_DIR/" \; 2>/dev/null || true
          fi
          echo "===== ios-dsym artifact contents ====="
          ls -laR "$DSYM_DIR" 2>/dev/null || echo "No dSYM collected."
        continue-on-error: true

      - name: Upload iOS dSYM artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: ios-dsym
          path: ${{ runner.temp }}/ios-dsym
          if-no-files-found: ignore

  submit:
    needs: build
    runs-on: macos-26
    if: github.event.inputs.profile == 'production'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: false
          sparse-checkout: |
            /*
            !manager-francis
          sparse-checkout-cone-mode: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Download iOS artifact
        uses: actions/download-artifact@v4
        with:
          name: ios-build

      - name: Submit to App Store
        run: |
          HAS_ASC=$([ -n "$ASC_KEY_ID" ] && [ -n "$ASC_ISSUER_ID" ] && [ -n "$ASC_KEY_P8_BASE64" ]; echo $?)
          HAS_PASSWORD=$([ -n "$EXPO_APPLE_APP_SPECIFIC_PASSWORD" ]; echo $?)
          if [ "$HAS_ASC" -ne 0 ] && [ "$HAS_PASSWORD" -ne 0 ]; then
            echo "::error::No Apple credentials set. Add ASC_KEY_ID, ASC_ISSUER_ID, ASC_KEY_P8_BASE64 or EXPO_APPLE_APP_SPECIFIC_PASSWORD to GitHub Secrets."
            exit 1
          fi
          IPA=$(find . -maxdepth 5 -name "*.ipa" -type f 2>/dev/null | head -1)
          if [ -z "$IPA" ]; then
            echo "::error::No .ipa file found in artifact"
            exit 1
          fi
          # Swap to plugin-free config so EAS submit doesn't resolve expo-dev-client
          # (avoids "Failed to resolve plugin for module expo-dev-client")
          cp app.config.js app.config.js.bak
          cp app.config.submit.js app.config.js
          trap 'mv -f app.config.js.bak app.config.js' EXIT
          echo "Submitting iOS app to App Store Connect..."
          if [ -n "$ASC_KEY_ID" ] && [ -n "$ASC_ISSUER_ID" ] && [ -n "$ASC_KEY_P8_BASE64" ]; then
            echo "Using App Store Connect API keys"
            echo "$ASC_KEY_P8_BASE64" | base64 -d > /tmp/asc-key.p8
            chmod 600 /tmp/asc-key.p8
            if command -v jq &> /dev/null; then
              jq --arg path "/tmp/asc-key.p8" --arg kid "$ASC_KEY_ID" --arg iid "$ASC_ISSUER_ID" '.submit.production.ios.ascApiKeyPath = $path | .submit.production.ios.ascApiKeyId = $kid | .submit.production.ios.ascApiKeyIssuerId = $iid' eas.json > eas.json.tmp && mv eas.json.tmp eas.json
            else
              printf 'import json\nimport os\n\nwith open("eas.json", "r") as f:\n    config = json.load(f)\n\nconfig["submit"]["production"]["ios"]["ascApiKeyPath"] = "/tmp/asc-key.p8"\nconfig["submit"]["production"]["ios"]["ascApiKeyId"] = os.environ["ASC_KEY_ID"]\nconfig["submit"]["production"]["ios"]["ascApiKeyIssuerId"] = os.environ["ASC_ISSUER_ID"]\n\nwith open("eas.json", "w") as f:\n    json.dump(config, f, indent=2)\n' > /tmp/update_eas.py
              python3 /tmp/update_eas.py
            fi
            npx eas-cli submit --platform ios --path "$IPA" --profile production --non-interactive
          else
            echo "Using app-specific password"
            npx eas-cli submit --platform ios --path "$IPA" --profile production --non-interactive
          fi
          echo "✅ Successfully submitted to App Store Connect!"
        env:
          CI: "true"
          EXPO_NO_PROMPT: "1"
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8_BASE64: ${{ secrets.ASC_KEY_P8_BASE64 }}
          EXPO_APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.EXPO_APPLE_APP_SPECIFIC_PASSWORD }}

      - name: Send success email
        if: success()
        continue-on-error: true
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: ${{ secrets.SMTP_SERVER }}
          server_port: ${{ secrets.SMTP_PORT }}
          username: ${{ secrets.SMTP_USERNAME }}
          password: ${{ secrets.SMTP_PASSWORD }}
          subject: '✅ iOS Build & Deploy Successful - GrabDocs'
          to: dev@grabdocs.com
          from: ${{ secrets.SMTP_FROM }}
          body: |
            iOS build and deployment completed successfully!
            Platform: iOS
            Profile: ${{ github.event.inputs.profile }}
            Workflow: ${{ github.workflow }}
            Run: ${{ github.run_number }}
            Commit: ${{ github.sha }}
            Branch: ${{ github.ref_name }}
            Actor: ${{ github.actor }}
            View run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

      - name: Send failure email
        if: failure()
        continue-on-error: true
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: ${{ secrets.SMTP_SERVER }}
          server_port: ${{ secrets.SMTP_PORT }}
          username: ${{ secrets.SMTP_USERNAME }}
          password: ${{ secrets.SMTP_PASSWORD }}
          subject: '❌ iOS Build & Deploy Failed - GrabDocs'
          to: dev@grabdocs.com
          from: ${{ secrets.SMTP_FROM }}
          body: |
            iOS build or deployment failed!
            Platform: iOS
            Profile: ${{ github.event.inputs.profile }}
            Workflow: ${{ github.workflow }}
            Run: ${{ github.run_number }}
            Commit: ${{ github.sha }}
            Branch: ${{ github.ref_name }}
            Actor: ${{ github.actor }}
            View run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
            Please check the workflow logs for details.
