# Generate iOS native folder via prebuild on macOS and commit it.
# Use when you don't have a Mac: run this workflow to generate ios/ with the
# GrabDocsBroadcastUpload extension target, then run "Build iOS" to build.
# Trigger: manual (workflow_dispatch) only.

name: Prebuild iOS

on:
  workflow_dispatch:

jobs:
  prebuild:
    runs-on: macos-latest
    permissions:
      contents: write   # needed to push the ios folder
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: false
          sparse-checkout: |
            /*
            !manager-francis
          sparse-checkout-cone-mode: false

      - name: Remove manager-francis submodule entry
        run: |
          set +e
          git config -f .gitmodules --remove-section submodule.manager-francis 2>/dev/null || true
          git submodule deinit -f manager-francis 2>/dev/null || true
          git rm --cached manager-francis 2>/dev/null || true
          rm -rf .git/modules/manager-francis manager-francis 2>/dev/null || true
          git reset --hard HEAD 2>/dev/null || true
          git clean -fd 2>/dev/null || true
        continue-on-error: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Setup EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install dependencies
        run: npm ci

      - name: Run prebuild (iOS)
        run: npx expo prebuild --platform ios --clean --no-install
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}

      - name: Patch Podfile (nest extension for CocoaPods host target)
        run: node scripts/patch-ios-podfile.js

      - name: Commit and push ios folder
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add ios/
          if git diff --staged --quiet; then
            echo "No changes to ios folder"
            exit 0
          fi
          git commit -m "chore(ios): regenerate ios folder via prebuild (GrabDocsBroadcastUpload target)"
          BRANCH="${GITHUB_REF#refs/heads/}"
          git pull origin "$BRANCH" --rebase
          git push origin "$BRANCH"
