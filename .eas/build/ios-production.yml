build:
  name: iOS Production (with extension profile)
  steps:
    - eas/checkout
    - eas/install_node_modules
    - eas/resolve_apple_team_id_from_credentials:
        id: resolve_apple_team_id_from_credentials
    - eas/prebuild:
        inputs:
          clean: false
          apple_team_id: ${ steps.resolve_apple_team_id_from_credentials.apple_team_id }
    - run:
        name: Patch Podfile for GrabDocsBroadcastUpload extension
        command: node scripts/ensure-podfile-extension.js && node scripts/ensure-pbxproj-embed-phase.js
    - run:
        name: Install CocoaPods dependencies
        command: cd ios && pod install
    - run:
        name: Sanitize project.pbxproj (remove undefined / empty file types for Xcode)
        command: |
          PBXPROJ=$(find ios -name "project.pbxproj" -path "*.xcodeproj/*" | head -1)
          if [ -z "$PBXPROJ" ]; then exit 0; fi
          node scripts/ensure-pbxproj-embed-phase.js
          if grep -q " = undefined" "$PBXPROJ" 2>/dev/null; then
            sed -i '' 's/fileEncoding = undefined/fileEncoding = 4/g' "$PBXPROJ"
            sed -i '' 's/includeInIndex = undefined/includeInIndex = 0/g' "$PBXPROJ"
            sed -i '' -E 's/([a-zA-Z0-9_]+) = undefined/\1 = ""/g' "$PBXPROJ"
            echo "✅ Sanitized remaining undefined in project.pbxproj"
          fi
    - run:
        name: Install GrabDocsBroadcastUpload provisioning profile
        command: |
          PROFILE_DIR="$HOME/Library/MobileDevice/Provisioning Profiles"
          mkdir -p "$PROFILE_DIR"

          # Support both: file path (e.g. GitHub Actions sets EXT_PROVISIONING_PROFILE=/tmp/ext.mobileprovision) or base64 content (EAS secret).
          if [ -n "$EXT_PROVISIONING_PROFILE" ] && [ -f "$EXT_PROVISIONING_PROFILE" ]; then
            if [ "$EXT_PROVISIONING_PROFILE" != "/tmp/ext.mobileprovision" ]; then
              cp "$EXT_PROVISIONING_PROFILE" /tmp/ext.mobileprovision
            fi
            echo "Using extension profile from path: $EXT_PROVISIONING_PROFILE"
          elif [ -n "$EXT_PROVISIONING_PROFILE" ]; then
            echo "$EXT_PROVISIONING_PROFILE" | base64 --decode > /tmp/ext.mobileprovision
            echo "Decoded extension profile from base64 (EAS secret)"
          else
            echo "::error::EXT_PROVISIONING_PROFILE not set. For EAS cloud: add base64-encoded .mobileprovision as EAS secret. For local/CI: set env to path of installed profile (e.g. /tmp/ext.mobileprovision)."
            exit 1
          fi

          if [ ! -s /tmp/ext.mobileprovision ]; then
            echo "::error::Extension profile file is empty or invalid."
            exit 1
          fi

          # Extract the UUID (|| true so set -eo pipefail does not exit when PlistBuddy fails)
          RAW_UUID=$(security cms -D -i /tmp/ext.mobileprovision 2>/dev/null \
            | /usr/libexec/PlistBuddy -c 'Print UUID' /dev/stdin 2>/dev/null) || true
          # Only use if it looks like a UUID (PlistBuddy may print "Error Reading File: ..." on failure)
          if [ -n "$RAW_UUID" ] && echo "$RAW_UUID" | grep -qE '^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$'; then
            UUID="$RAW_UUID"
          else
            UUID=""
          fi

          if [ -n "$UUID" ]; then
            cp /tmp/ext.mobileprovision "$PROFILE_DIR/$UUID.mobileprovision"
            echo "✅ Installed extension profile: $UUID"
          else
            cp /tmp/ext.mobileprovision "$PROFILE_DIR/GrabDocsBroadcastUpload.mobileprovision"
            echo "⚠️  Could not extract UUID, installed with fixed name"
          fi
    - eas/configure_eas_update
    - eas/configure_ios_credentials
    - run:
        name: Set extension provisioning profile UUID in project (after credentials)
        command: |
          PBXPROJ=$(find ios -name "project.pbxproj" -path "*.xcodeproj/*" | head -1)
          if [ -z "$PBXPROJ" ]; then
            echo "project.pbxproj not found, skipping"
            exit 0
          fi

          # Get UUID: prefer /tmp/ext.mobileprovision (from our install step),
          # then search installed profiles for the extension bundle ID.
          PROFILE_DIR="$HOME/Library/MobileDevice/Provisioning Profiles"
          EXT_BUNDLE="com.grabdocs.mobile.GrabDocsBroadcastUpload"
          UUID=""

          if [ -f /tmp/ext.mobileprovision ]; then
            UUID=$(security cms -D -i /tmp/ext.mobileprovision 2>/dev/null | /usr/libexec/PlistBuddy -c 'Print UUID' /dev/stdin 2>/dev/null || true)
            echo "UUID from /tmp/ext.mobileprovision: $UUID"
          fi

          if [ -z "$UUID" ] || [ "${#UUID}" -ne 36 ]; then
            echo "Searching installed profiles for $EXT_BUNDLE..."
            for profile in "$PROFILE_DIR"/*.mobileprovision; do
              [ -f "$profile" ] || continue
              APP_ID=$(security cms -D -i "$profile" 2>/dev/null | /usr/libexec/PlistBuddy -c 'Print Entitlements:application-identifier' /dev/stdin 2>/dev/null || true)
              if echo "$APP_ID" | grep -q "$EXT_BUNDLE"; then
                UUID=$(security cms -D -i "$profile" 2>/dev/null | /usr/libexec/PlistBuddy -c 'Print UUID' /dev/stdin 2>/dev/null || true)
                echo "Found extension profile in: $profile  UUID=$UUID"
                break
              fi
            done
          fi

          if [ -z "$UUID" ] || [ "${#UUID}" -ne 36 ]; then
            echo "⚠️  Could not find extension profile UUID; pbxproj not patched"
            exit 0
          fi

          # Replace any UUID currently set for the extension target (handles hardcoded or EAS-set values)
          # First try the known hardcoded UUID
          if grep -q "PROVISIONING_PROFILE = \"f5a9c6da-0810-4a56-8963-3cb9894f83a1\"" "$PBXPROJ"; then
            sed -i '' "s/PROVISIONING_PROFILE = \"f5a9c6da-0810-4a56-8963-3cb9894f83a1\"/PROVISIONING_PROFILE = \"$UUID\"/g" "$PBXPROJ"
            echo "✅ Replaced hardcoded UUID with $UUID"
          else
            echo "Hardcoded UUID not found; extension may already have been patched by configure_ios_credentials"
          fi
          echo "Current extension PROVISIONING_PROFILE lines:"
          grep "PROVISIONING_PROFILE" "$PBXPROJ" | grep -v "SPECIFIER" || true
    - eas/generate_gymfile_from_template:
        inputs:
          credentials: ${ eas.job.secrets.buildCredentials }
    - run:
        name: Patch Gymfile to include extension provisioning profile
        command: |
          GYMFILE=$(find . -name "Gymfile" -not -path "*/node_modules/*" | head -1)
          if [ -z "$GYMFILE" ] || [ ! -f "$GYMFILE" ]; then
            echo "Gymfile not found, skipping"
            exit 0
          fi
          echo "=== Gymfile before patch ==="
          cat "$GYMFILE"
          echo "==========================="

          PROFILE_DIR="$HOME/Library/MobileDevice/Provisioning Profiles"
          EXT_BUNDLE="com.grabdocs.mobile.GrabDocsBroadcastUpload"
          EXT_UUID=""

          # Find extension profile UUID from installed profiles
          for profile in "$PROFILE_DIR"/*.mobileprovision; do
            [ -f "$profile" ] || continue
            APP_ID=$(security cms -D -i "$profile" 2>/dev/null | /usr/libexec/PlistBuddy -c 'Print Entitlements:application-identifier' /dev/stdin 2>/dev/null || true)
            if echo "$APP_ID" | grep -q "$EXT_BUNDLE"; then
              RAW=$(security cms -D -i "$profile" 2>/dev/null | /usr/libexec/PlistBuddy -c 'Print UUID' /dev/stdin 2>/dev/null || true)
              if echo "$RAW" | grep -qE '^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$'; then
                EXT_UUID="$RAW"
                echo "Extension profile UUID for Gymfile: $EXT_UUID"
                break
              fi
            fi
          done

          # Fallback: try /tmp/ext.mobileprovision
          if [ -z "$EXT_UUID" ] && [ -f /tmp/ext.mobileprovision ]; then
            EXT_UUID=$(security cms -D -i /tmp/ext.mobileprovision 2>/dev/null | /usr/libexec/PlistBuddy -c 'Print UUID' /dev/stdin 2>/dev/null || true)
          fi

          if [ -z "$EXT_UUID" ]; then
            echo "⚠️  Could not find extension profile UUID; Gymfile not patched"
            exit 0
          fi

          # EAS often maps the extension bundle ID to the main app profile — we must replace that with the extension profile UUID.
          # Replace any existing mapping for the extension bundle ID (Ruby: "key" => "value" or "key" => 'value').
          if grep -q "GrabDocsBroadcastUpload" "$GYMFILE"; then
            sed -i '' "s|\"${EXT_BUNDLE}\" => \"[^\"]*\"|\"${EXT_BUNDLE}\" => \"${EXT_UUID}\"|g" "$GYMFILE"
            sed -i '' "s|\"${EXT_BUNDLE}\" => '[^']*'|\"${EXT_BUNDLE}\" => \"${EXT_UUID}\"|g" "$GYMFILE"
            echo "✅ Replaced extension bundle ID mapping with extension profile UUID in Gymfile"
          fi

          # If extension was not in Gymfile, add it to provisioningProfiles
          if ! grep -q "GrabDocsBroadcastUpload" "$GYMFILE"; then
            if grep -q 'provisioningProfiles' "$GYMFILE"; then
              sed -i '' "s|\"provisioningProfiles\" => {|\"provisioningProfiles\" => { \"${EXT_BUNDLE}\" => \"${EXT_UUID}\",|" "$GYMFILE" 2>/dev/null \
                || sed -i '' "s|provisioningProfiles: {|provisioningProfiles: { \"${EXT_BUNDLE}\" => \"${EXT_UUID}\",|" "$GYMFILE"
              echo "✅ Added extension to provisioningProfiles in Gymfile"
            elif grep -q 'export_options' "$GYMFILE"; then
              sed -i '' "s|export_options: {|export_options: { provisioningProfiles: { \"${EXT_BUNDLE}\" => \"${EXT_UUID}\" },|" "$GYMFILE"
              echo "✅ Added provisioningProfiles with extension to Gymfile export_options"
            else
              echo "⚠️  Could not find provisioningProfiles or export_options in Gymfile"
            fi
          fi

          echo "=== Gymfile after patch ==="
          cat "$GYMFILE"
          echo "=========================="
    - eas/run_fastlane
    - eas/find_and_upload_build_artifacts
