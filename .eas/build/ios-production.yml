build:
  name: iOS Production (single-profile automatic signing)
  steps:
    - eas/checkout
    - eas/install_node_modules
    - eas/resolve_apple_team_id_from_credentials:
        id: resolve_apple_team_id_from_credentials
    - eas/prebuild:
        inputs:
          clean: false
          apple_team_id: ${ steps.resolve_apple_team_id_from_credentials.apple_team_id }
    - run:
        name: Patch Podfile for GrabDocsBroadcastUpload extension
        command: node scripts/ensure-podfile-extension.js && node scripts/ensure-pbxproj-embed-phase.js
    - run:
        name: Ensure extension entitlements have App Group
        command: node scripts/ensure-extension-entitlements.js
    - run:
        name: Install CocoaPods dependencies
        command: |
          cd ios
          # Force repo update so Hermes prebuilt XCFramework is fetched (avoids "[CP] Copy XCFrameworks" rsync missing path)
          pod install --repo-update
          HERMES_XCFW="Pods/hermes-engine/destroot/Library/Frameworks/universal/hermes.xcframework/ios-arm64"
          if [ ! -d "$HERMES_XCFW" ] || [ -z "$(ls -A "$HERMES_XCFW" 2>/dev/null)" ]; then
            echo "::warning::Hermes XCFramework not found at $HERMES_XCFW after first pod install; retrying..."
            pod install --repo-update
          fi
          if [ ! -d "$HERMES_XCFW" ] || [ -z "$(ls -A "$HERMES_XCFW" 2>/dev/null)" ]; then
            echo "::error::Hermes XCFramework still missing at $HERMES_XCFW. Check hermes-engine pod and network."
            ls -la Pods/hermes-engine 2>/dev/null || true
            ls -la Pods/hermes-engine/destroot 2>/dev/null || true
            exit 1
          fi
          echo "✅ Hermes XCFramework present at $HERMES_XCFW"
    - run:
        name: Sanitize project.pbxproj (remove undefined / empty file types for Xcode)
        command: |
          PBXPROJ=$(find ios -name "project.pbxproj" -path "*.xcodeproj/*" | head -1)
          if [ -z "$PBXPROJ" ]; then exit 0; fi
          node scripts/ensure-pbxproj-embed-phase.js
          if grep -q " = undefined" "$PBXPROJ" 2>/dev/null; then
            sed -i '' 's/fileEncoding = undefined/fileEncoding = 4/g' "$PBXPROJ"
            sed -i '' 's/includeInIndex = undefined/includeInIndex = 0/g' "$PBXPROJ"
            sed -i '' -E 's/([a-zA-Z0-9_]+) = undefined/\1 = ""/g' "$PBXPROJ"
            echo "✅ Sanitized remaining undefined in project.pbxproj"
          fi
    - eas/configure_eas_update
    - eas/configure_ios_credentials
    - run:
        name: Install extension provisioning profile and patch pbxproj
        command: |
          PBXPROJ=$(find ios -name "project.pbxproj" -path "*.xcodeproj/*" ! -path "*/Pods/*" | head -1)
          if [ -z "$PBXPROJ" ]; then
            echo "::error::project.pbxproj not found under ios/ (excluding Pods)"
            exit 1
          fi
          echo "Using project: $PBXPROJ"

          if [ -z "$EXT_PROVISIONING_PROFILE_BASE64" ]; then
            echo "::error::EXT_PROVISIONING_PROFILE_BASE64 is not set."
            echo "Add the extension provisioning profile (App Store, for com.grabdocs.mobile.GrabDocsBroadcastUpload)"
            echo "as a base64-encoded GitHub secret named EXT_PROVISIONING_PROFILE_BASE64."
            exit 1
          fi

          # Install the extension profile (normalize base64: remove whitespace/newlines so paste into Secrets works)
          PROFILE_DIR="$HOME/Library/MobileDevice/Provisioning Profiles"
          mkdir -p "$PROFILE_DIR"
          EXT_PROFILE_FILE="$PROFILE_DIR/ext-grabdocs-broadcast.mobileprovision"
          printf '%s' "$EXT_PROVISIONING_PROFILE_BASE64" | tr -d '\n\r\t ' | base64 --decode > "$EXT_PROFILE_FILE"
          FILESIZE=$(wc -c < "$EXT_PROFILE_FILE" | tr -d ' ')
          echo "Decoded profile size: $FILESIZE bytes (expect 15000+ for a real .mobileprovision)"
          if [ "$FILESIZE" -lt 10000 ]; then
            echo "::error::Decoded profile too small ($FILESIZE bytes). EXT_PROVISIONING_PROFILE_BASE64 is truncated or invalid."
            echo "Re-encode: PowerShell: [Convert]::ToBase64String([IO.File]::ReadAllBytes('path\to\file.mobileprovision'))"
            echo "Paste the ENTIRE one-line output into the GitHub secret (no line breaks). Or set EXT_PROVISIONING_PROFILE_UUID and use GitHub CLI to set the base64: gh secret set EXT_PROVISIONING_PROFILE_BASE64 < encoded.txt"
            exit 1
          fi

          # Extract UUID: try openssl plist, then grep (lowercase and uppercase), then env override
          EXT_UUID=""
          TMPFILE=$(mktemp /tmp/ext_profile_XXXXXX.plist)

          if openssl smime -verify -noverify -inform DER -in "$EXT_PROFILE_FILE" -out "$TMPFILE" 2>/dev/null; then
            EXT_UUID=$(/usr/libexec/PlistBuddy -c 'Print UUID' "$TMPFILE" 2>/dev/null || true)
            [ -n "$EXT_UUID" ] && echo "UUID from openssl plist: $EXT_UUID"
          fi
          if [ -z "$EXT_UUID" ] || [ "${#EXT_UUID}" -ne 36 ]; then
            EXT_UUID=$(grep -aEo '[0-9A-Fa-f]{8}-[0-9A-Fa-f]{4}-[0-9A-Fa-f]{4}-[0-9A-Fa-f]{4}-[0-9A-Fa-f]{12}' "$EXT_PROFILE_FILE" | head -1)
            [ -n "$EXT_UUID" ] && echo "UUID from grep: $EXT_UUID"
          fi
          if [ -z "$EXT_UUID" ] || [ "${#EXT_UUID}" -ne 36 ]; then
            if [ -n "$EXT_PROVISIONING_PROFILE_UUID" ] && [ "${#EXT_PROVISIONING_PROFILE_UUID}" -eq 36 ]; then
              EXT_UUID="$EXT_PROVISIONING_PROFILE_UUID"
              echo "Using EXT_PROVISIONING_PROFILE_UUID from env: $EXT_UUID"
            fi
          fi

          EXT_APP_ID=$(/usr/libexec/PlistBuddy -c 'Print Entitlements:application-identifier' "$TMPFILE" 2>/dev/null || true)
          EXT_NAME=$(/usr/libexec/PlistBuddy -c 'Print Name' "$TMPFILE" 2>/dev/null || true)
          rm -f "$TMPFILE"

          echo "Installed extension profile: UUID=$EXT_UUID App ID=$EXT_APP_ID Name=$EXT_NAME size=$FILESIZE bytes"

          if [ -z "$EXT_UUID" ] || [ "${#EXT_UUID}" -ne 36 ]; then
            echo "::error::Could not get extension profile UUID. Set GitHub secret EXT_PROVISIONING_PROFILE_UUID to your extension profile UUID (e.g. from Apple Developer Portal)."
            echo "File head (hex):"
            xxd "$EXT_PROFILE_FILE" | head -6
            exit 1
          fi

          # Rename file to UUID (standard Xcode convention)
          mv "$EXT_PROFILE_FILE" "$PROFILE_DIR/${EXT_UUID}.mobileprovision"

          # Patch pbxproj: set extension target to Manual signing with this UUID
          node scripts/patch-ext-profile.js "$PBXPROJ" "$EXT_UUID"
          echo "✅ Extension target patched with profile UUID $EXT_UUID"
    - run:
        name: Write Gymfile
        command: |
          GYMFILE="ios/Gymfile"
          printf 'workspace "./GrabDocs.xcworkspace"\n' > "$GYMFILE"
          printf 'scheme "GrabDocs"\n' >> "$GYMFILE"
          printf 'configuration "Release"\n' >> "$GYMFILE"
          printf 'clean false\n' >> "$GYMFILE"
          printf 'export_method "app-store"\n' >> "$GYMFILE"
          printf 'export_team_id "Q33K3Q7Q53"\n' >> "$GYMFILE"
          printf 'output_directory "./build"\n' >> "$GYMFILE"
          printf 'output_name "GrabDocs.ipa"\n' >> "$GYMFILE"
          printf 'skip_profile_detection true\n' >> "$GYMFILE"
          echo "=== Gymfile (skip_profile_detection=true; both targets use manual pbxproj profiles) ==="
          cat "$GYMFILE"
    - run:
        name: Run Fastlane gym
        command: |
          cd ios
          mkdir -p build
          set +e
          fastlane gym 2>&1 | tee ../gym_output.log
          GYM_EXIT=$?
          set -e
          echo ""
          echo "===== BUILD RESULT: exit code $GYM_EXIT ====="
          if [ "$GYM_EXIT" -ne 0 ]; then
            echo "===== Errors in gym output (from captured log) ====="
            grep -n "error:\|Error:\|ARCHIVE FAILED\|failure\|doesn't include\|No profiles for\|signing certificate\|rsync\|No such file\|exited with status" ../gym_output.log | tail -80
            echo ""
            echo "===== Last 120 lines of gym output ====="
            tail -120 ../gym_output.log
          fi
          exit $GYM_EXIT
    - eas/find_and_upload_build_artifacts
